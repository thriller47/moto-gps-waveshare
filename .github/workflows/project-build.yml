name: Project Build

on:
  push:
    branches:
      - valhalla
      - 'test/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - valhalla
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      build_native:
        description: 'Build native core and tests'
        type: boolean
        default: true
      build_android:
        description: 'Build Android APK'
        type: boolean
        default: true
      build_esp32:
        description: 'Build ESP32-S3 Firmware'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: project-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  detect-changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
      esp32: ${{ steps.filter.outputs.esp32 }}
    steps:
      - uses: actions/checkout@v5
        with:
          # dorny/paths-filter needs the prior commit on this same branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # On push, compare against the preceding commit of this branch.
          # On PR, compare against the destination branch.
          base: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}
          filters: |
            native:
              - '.github/workflows/project-build.yml'
              - 'CMakeLists.txt'
              - 'shared/**'
              - 'core/**'
              - 'common/**'
              - 'src/**'
              - 'include/**'
              - 'tests/native/**'
              - 'platforms/web/**'
              - 'scripts/generate_jinan_demo_fixture.mjs'
              - 'scripts/fixture_coordinates.mjs'
              - 'scripts/offline_map/**'
              - 'third_party/**'
            android:
              - 'platforms/android/**'
              # Explicitly list shared modules relevant to Android instead of
              # negating nav_ui: dorny/paths-filter uses OR (some) matching,
              # so a lone negative pattern also matches unrelated files.
              - 'shared/ble_protocol/**'
              - 'shared/coordinates/**'
              - 'shared/demo_fixture/**'
              - 'shared/nav_app/**'
              - 'shared/nav_core/**'
              - 'shared/nav_presenter/**'
              - 'shared/offline_map/**'
              - 'shared/port_api/**'
              - 'shared/protocol/**'
              - 'core/**'
              - 'common/**'
            esp32:
              - '.github/workflows/project-build.yml'
              - 'platforms/esp32/**'
              - 'shared/**'
              - 'core/**'
              - 'common/**'

  native:
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.build_native == true) ||
        (github.event_name != 'workflow_dispatch' && needs.detect-changes.outputs.native == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure and build native core
        run: |
          cmake -S . -B build/native -DMOTO_BUILD_WEB=OFF -DMOTO_BUILD_TESTS=ON
          cmake --build build/native --parallel 4

      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure

      - name: Check browser simulator JavaScript syntax and replay model tests
        run: |
          node --check platforms/web/simulator/player.js
          node --check platforms/web/simulator/trace_model.js
          node --check platforms/web/simulator/fallback_map.js
          node --check platforms/web/simulator/ring_alignment.js
          node --test platforms/web/simulator/trace_model.test.cjs platforms/web/simulator/fallback_map.test.cjs platforms/web/simulator/ring_alignment.test.cjs

      - name: Verify public demo map fixture
        run: node scripts/generate_jinan_demo_fixture.mjs --check

      - name: Verify MotoMap v3 converter contract
        run: python3 -m unittest discover -s scripts/offline_map -p 'test_motomap_v4.py'



  android:
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.build_android == true) ||
        (github.event_name != 'workflow_dispatch' && needs.detect-changes.outputs.android == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Android NDK 27 is installed (retry corrupted downloads)
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" ]]; then
            echo "::error::ANDROID_HOME / ANDROID_SDK_ROOT not configured"
            exit 1
          fi
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$manager" || ! -x "$manager" ]]; then
            echo "::error::Android sdkmanager is missing"
            exit 1
          fi
          ndk="$sdk/ndk/27.0.12077973"
          for attempt in 1 2 3; do
            if [[ -f "$ndk/source.properties" ]] && grep -q '^Pkg.Revision = 27.0.12077973' "$ndk/source.properties"; then
              echo "NDK 27.0.12077973 ready"
              exit 0
            fi
            echo "NDK installation attempt $attempt/3"
            rm -rf "$ndk"
            if "$manager" --sdk_root="$sdk" --install 'ndk;27.0.12077973'; then
              if [[ -f "$ndk/source.properties" ]] && grep -q '^Pkg.Revision = 27.0.12077973' "$ndk/source.properties"; then
                echo "NDK installed successfully"
                exit 0
              fi
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 5)); fi
          done
          echo "::error::NDK installation failed after 3 attempts"
          exit 1

      - name: Make gradlew executable
        run: chmod +x platforms/android/gradlew

      - name: Prepare persistent Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MOTO_GPS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Firma persistente non configurata: i debug APK potrebbero richiedere la reinstallazione. Consulta docs/android-apk-signing.md"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moto-gps-release.jks"
            chmod 600 "$RUNNER_TEMP/moto-gps-release.jks"
            echo "MOTO_GPS_KEYSTORE_PATH=$RUNNER_TEMP/moto-gps-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Android app
        env:
          MOTO_GPS_VERSION_CODE: ${{ github.run_number }}
          MOTO_GPS_KEYSTORE_PASSWORD: ${{ secrets.MOTO_GPS_KEYSTORE_PASSWORD }}
          MOTO_GPS_KEY_ALIAS: ${{ secrets.MOTO_GPS_KEY_ALIAS }}
          MOTO_GPS_KEY_PASSWORD: ${{ secrets.MOTO_GPS_KEY_PASSWORD }}
        run: cd platforms/android && ./gradlew build -x lint -x lintVitalRelease --build-cache

      - name: Upload APK
        if: ${{ hashFiles('platforms/android/app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: Glimpse-MOTO-GPS-Android-Final.apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  esp32:
    needs: [detect-changes]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.build_esp32 == true) ||
        (github.event_name != 'workflow_dispatch' && needs.detect-changes.outputs.esp32 == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache ESP-IDF ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-esp32s3-ccache-${{ hashFiles('platforms/esp32/**') }}
          restore-keys: |
            ${{ runner.os }}-esp32s3-ccache-

      - name: Build ESP32 firmware
        uses: espressif/esp-idf-ci-action@v1
        env:
          IDF_CCACHE_ENABLE: 1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: platforms/esp32
          # The four display/runtime options were road-tested on 12 Nov 2026.
          # Keep the valhalla build aligned with the validated test firmware.
          command: >-
            idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.perf.defaults" set-target esp32s3 &&
            idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.perf.defaults"
            -DMOTO_ESP_CURVE_ZOOM_EXPERIMENT=ON
            -DMOTO_ESP_SUBPIXEL_EXPERIMENT=ON
            -DMOTO_ESP_MAP_DIRTY_TILES_EXPERIMENT=ON
            -DMOTO_ESP_PERF_TELEMETRY_EXPERIMENT=ON build

      - name: Rename output binary
        run: |
          sudo chown -R $USER:$USER platforms/esp32/build
          if [ -f "platforms/esp32/build/moto_gps_esp32.bin" ]; then
            mv "platforms/esp32/build/moto_gps_esp32.bin" "platforms/esp32/build/moto-gps-waveshare.bin"
          fi

      - name: Upload ESP32 artifacts
        if: >-
          ${{
            hashFiles('platforms/esp32/build/bootloader/bootloader.bin') != '' ||
            hashFiles('platforms/esp32/build/partition_table/partition-table.bin') != '' ||
            hashFiles('platforms/esp32/build/moto-gps-waveshare.bin') != ''
          }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(github.ref, 'refs/heads/test/') && 'ESP32-Firmware-EXPERIMENTAL' || 'ESP32-Firmware' }}
          path: |
            platforms/esp32/build/bootloader/bootloader.bin
            platforms/esp32/build/partition_table/partition-table.bin
            platforms/esp32/build/moto-gps-waveshare.bin
          retention-days: 3
